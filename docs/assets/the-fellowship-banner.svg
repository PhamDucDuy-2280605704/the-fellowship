<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">The Fellowship — A shared world for ambitious teams</title>
<desc id="desc">Banner fantasy medieval với thành cổ, đại sảnh hội đồng, phù hiệu phát sáng và các đốm lửa chuyển động.</desc>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080d18"/><stop offset=".48" stop-color="#111a2a"/><stop offset="1" stop-color="#211b29"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0bb"/><stop offset=".45" stop-color="#d9ad68"/><stop offset="1" stop-color="#8b633d"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34465a"/><stop offset=".5" stop-color="#1a293c"/><stop offset="1" stop-color="#0d1728"/>
  </linearGradient>
  <radialGradient id="moon">
    <stop offset="0" stop-color="#fff3ce" stop-opacity=".52"/><stop offset=".42" stop-color="#d9b879" stop-opacity=".16"/><stop offset="1" stop-color="#d9b879" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="aura">
    <stop offset="0" stop-color="#d5a75f" stop-opacity=".28"/><stop offset="1" stop-color="#d5a75f" stop-opacity="0"/>
  </radialGradient>
  <pattern id="stars" width="94" height="74" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="14" r="1" fill="#f8e7c1" opacity=".55"/>
    <circle cx="68" cy="48" r=".8" fill="#d9e3f1" opacity=".42"/>
    <circle cx="42" cy="66" r=".65" fill="#f8e7c1" opacity=".35"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shine" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes breathe { 0%,100%{opacity:.35} 50%{opacity:.82} }
    @keyframes drift { 0%{transform:translateY(0);opacity:0} 15%{opacity:.9} 85%{opacity:.7} 100%{transform:translateY(-82px);opacity:0} }
    @keyframes orbit { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes flicker { 0%,100%{opacity:.75} 35%{opacity:1} 55%{opacity:.55} 72%{opacity:.92} }
    .breathe{animation:breathe 5s ease-in-out infinite}
    .orbit{transform-origin:1010px 208px;animation:orbit 46s linear infinite}
    .ember{animation:drift 7s ease-in-out infinite}
    .ember.delay1{animation-delay:2.1s}
    .ember.delay2{animation-delay:4.2s}
    .flame{animation:flicker 1.8s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.breathe,.orbit,.ember,.flame{animation:none!important}}
  </style>
</defs>

<rect width="1280" height="430" rx="26" fill="url(#night)"/>
<rect width="1280" height="430" rx="26" fill="url(#stars)"/>
<circle cx="1035" cy="164" r="260" fill="url(#moon)"/>
<circle cx="1030" cy="300" r="300" fill="url(#aura)" filter="url(#soft)"/>
<path d="M0 335L120 276 218 311 340 238 452 306 570 246 686 300 790 225 900 280 1014 214 1117 274 1280 206V430H0Z" fill="#111c2c" opacity=".72"/>
<path d="M650 353L745 278 824 307 916 240 1005 285 1100 222 1192 282 1280 240V430H650Z" fill="#0a1422" opacity=".82"/>

<!-- Distant citadel -->
<g fill="#0a1422" stroke="#8f754e" stroke-opacity=".18" stroke-width="2">
  <path d="M756 333V215h30v-48h24v48h18v-80h30v80h24v-58h24v58h26v-93h34v93h20v-55h26v55h23v-75h32v75h28v118Z"/>
  <path d="M744 217h52v-20h-52zm68-82h38v-18h-38zm94-1h42v-18h-42zm78 29h36v-18h-36zm78-21h40v-18h-40z"/>
  <path d="M770 334v-56q12-25 24 0v56m68 0v-65q14-26 28 0v65m86 0v-66q14-27 28 0v66m81 0v-54q13-23 26 0v54" fill="#d5a75f" fill-opacity=".25" stroke="none"/>
</g>
<g fill="#efc77e" class="flame" filter="url(#shine)">
  <rect x="779" y="235" width="5" height="10" rx="2"/><rect x="879" y="196" width="5" height="10" rx="2"/>
  <rect x="1006" y="222" width="5" height="10" rx="2"/><rect x="1124" y="188" width="5" height="10" rx="2"/>
</g>
<path d="M706 353H1255" stroke="#b9945d" stroke-opacity=".28" stroke-width="2"/>

<!-- Main title -->
<g transform="translate(82 88)">
  <text x="0" y="0" fill="#d9b879" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="5">A SHARED WORLD FOR AMBITIOUS TEAMS</text>
  <text x="-2" y="83" fill="#fff3d7" font-family="Georgia,serif" font-size="64" font-weight="700" letter-spacing="1">THE FELLOWSHIP</text>
  <path d="M2 106H535" stroke="url(#gold)" stroke-width="2" opacity=".82"/>
  <path d="M2 106l11 -5 11 5 -11 5z" fill="#e4bf7b"/>
  <text x="2" y="151" fill="#e3c894" font-family="Georgia,serif" font-size="24" font-style="italic">Goals · Decisions · Knowledge</text>
  <text x="3" y="195" fill="#c1c4c9" font-family="Arial,sans-serif" font-size="17">Cùng nhau đi xa hơn — từ mục tiêu chung</text>
  <text x="3" y="222" fill="#c1c4c9" font-family="Arial,sans-serif" font-size="17">đến hành động, quyết định và tri thức kế thừa.</text>
  <g transform="translate(2 270)">
    <rect x="0" y="-18" width="112" height="30" rx="15" fill="#d2a969" fill-opacity=".12" stroke="#d2a969" stroke-opacity=".55"/>
    <text x="56" y="2" text-anchor="middle" fill="#efd7a6" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">THE FELLOWSHIP</text>
    <rect x="124" y="-18" width="100" height="30" rx="15" fill="#d2a969" fill-opacity=".08" stroke="#d2a969" stroke-opacity=".35"/>
    <text x="174" y="2" text-anchor="middle" fill="#d9c7a5" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">THE COUNCIL</text>
    <rect x="236" y="-18" width="104" height="30" rx="15" fill="#d2a969" fill-opacity=".08" stroke="#d2a969" stroke-opacity=".35"/>
    <text x="288" y="2" text-anchor="middle" fill="#d9c7a5" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">THE ARCHIVES</text>
  </g>
</g>

<!-- Fellowship seal -->
<g class="breathe">
  <circle cx="1050" cy="175" r="145" fill="url(#aura)"/>
  <circle cx="1050" cy="175" r="105" fill="#101a29" fill-opacity=".55" stroke="#e4c488" stroke-opacity=".48" stroke-width="1.5"/>
  <circle cx="1050" cy="175" r="91" fill="none" stroke="#e4c488" stroke-opacity=".32" stroke-width="1" stroke-dasharray="2 7"/>
  <circle cx="1050" cy="175" r="76" fill="none" stroke="#e4c488" stroke-opacity=".42" stroke-width="1.5"/>
</g>
<g class="orbit" fill="none" stroke="#e6c17d" stroke-width="2">
  <path d="M1050 55l7 15-7 15-7-15z" fill="#e6c17d"/>
  <path d="M1050 265l6 12-6 12-6-12z" fill="#e6c17d"/>
  <path d="M930 175l12-6 12 6-12 6z" fill="#e6c17d"/>
  <path d="M1146 175l12-6 12 6-12 6z" fill="#e6c17d"/>
</g>
<g filter="url(#shine)">
  <path d="M1050 112l11 27 28 2-22 18 7 28-24-15-24 15 7-28-22-18 28-2z" fill="none" stroke="#f2d69e" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="1050" cy="166" r="10" fill="#d7ad69" opacity=".85"/>
  <path d="M1017 211h66M1027 222h46" stroke="#e9c782" stroke-opacity=".8" stroke-width="2"/>
  <text x="1050" y="245" text-anchor="middle" fill="#f4dfb7" font-family="Georgia,serif" font-size="11" letter-spacing="3">ONE FELLOWSHIP</text>
</g>

<!-- Floating embers -->
<g fill="#efc77e" filter="url(#shine)">
  <circle class="ember" cx="720" cy="325" r="2.3"/>
  <circle class="ember delay1" cx="835" cy="385" r="1.8"/>
  <circle class="ember delay2" cx="1160" cy="330" r="2.1"/>
  <circle class="ember delay1" cx="1220" cy="280" r="1.5"/>
  <circle class="ember delay2" cx="952" cy="360" r="1.7"/>
  <circle class="ember" cx="690" cy="260" r="1.5"/>
</g>
<path d="M28 28h58M28 28v48M1252 28h-58M1252 28v48M28 402h58M28 402v-48M1252 402h-58M1252 402v-48" fill="none" stroke="#d9b879" stroke-opacity=".38" stroke-width="1.5"/>
</svg>